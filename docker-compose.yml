version: '3.8'
services:
  sql_in_dc:
    build:
      context: .
      dockerfile: sql/sql.Dockerfile
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Sql1nContainersR0cks!"
    ports:
      - "1433:1433"

  carvedrock.api:
    build:
      context: .
      dockerfile: CarvedRock.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5050:80"
    depends_on:
      - sql_in_dc
  carvedrock.app:
    build:
      context: .
      dockerfile: CarvedRock.App/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5001:80"
    depends_on:
      - carvedrock.api